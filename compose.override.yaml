services:
  ###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "3307:3306"   # MariaDB, pour Symfony et les outils externes
  ###< doctrine/doctrine-bundle ###

  phpmyadmin:
    ports:
      - "8081:80"     # phpMyAdmin dans le navigateur

  ###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
